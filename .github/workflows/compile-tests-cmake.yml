name: Compile Examples (CMake)

# Exercises the new CMake build path (root CMakeLists.txt +
# cmake/xdsl_ccpp_capgen.cmake) added alongside the existing hand-written
# Makefiles that compile-tests.yml continues to drive unchanged. Add matrix
# entries here as more examples migrate, mirroring compile-tests.yml's own
# shape.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compile-examples-cmake:
    name: cmake compile+run (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - nested_suite
          - var_compat
          - tinyddt
          - advection
          - advection_flat_host
          - kessler
          - nestedddt
          - chararg
          - constadv
          - constprop
        # ctest -R does a plain substring match, and "advection" is a
        # literal prefix of "advection_flat_host"'s own test name
        # (ctest_advection_flat_host_integration) -- so the bare matrix
        # value "advection" would also match and re-run that other
        # example's test under this job. advection_flat_host needs no such
        # override: its own matrix value is already a unique substring of
        # only its own test name.
        #
        # constadv/constprop are known-failing here too, same root cause as
        # compile-tests.yml's own identical override (tracked in
        # https://github.com/johnmauff/xdsl-ccpp/issues/4) -- this CMake
        # build runs the exact same generated/compiled code, just through a
        # different build system, so the same not-yet-diagnosed runtime
        # issue applies equally. Remove once that issue is fixed.
        include:
          - example: advection
            ctest_filter: advection_host
          - example: constadv
            expected_failure: true
          - example: constprop
            expected_failure: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gfortran, gcc, and g++
        # gcc/g++ are normally already present on ubuntu-latest via
        # build-essential, but tinyddt (C++/chost) and kessler (C + C++/
        # chost) both need them, so install explicitly rather than relying
        # on that -- matches the existing explicit gfortran install below
        # instead of leaving any of the three compilers implicit.
        run: sudo apt-get update && sudo apt-get install -y gfortran gcc g++

      - name: Install xdsl-ccpp
        run: python -m pip install -e .

      - name: Install CMake
        run: python -m pip install cmake

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        # No specific --target: builds everything currently configured
        # (only examples/nested_suite's targets exist today), so this
        # doesn't need updating as more examples' CMakeLists.txt files are
        # added -- add_subdirectory in the root CMakeLists.txt is the only
        # place that needs a new line per example. continue-on-error here
        # too, not just on "Run tests" below: constadv/constprop's known
        # issue (see the matrix comment above) is described as "further
        # down the build/run chain," which could mean a link failure, not
        # just a runtime one -- each matrix entry is its own separate
        # runner, so this can't mask a real build failure in any other
        # example's own job.
        continue-on-error: ${{ matrix.expected_failure == true }}
        run: cmake --build build

      - name: Run tests
        continue-on-error: ${{ matrix.expected_failure == true }}
        run: ctest --test-dir build --output-on-failure -R ${{ matrix.ctest_filter || matrix.example }}
