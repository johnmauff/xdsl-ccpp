name: Compile Examples (CMake)

# Exercises the CMake build path (root CMakeLists.txt +
# cmake/xdsl_ccpp_capgen.cmake), now the sole build/test path for every
# compilable example -- the per-example hand-written Makefiles this
# workflow used to coexist alongside (and the Makefile-driven
# compile-tests.yml workflow that used to drive them) have been removed.
#
# Three jobs, one per compiler (ci-multi-compiler, BACKLOG.md): each job
# configures once and then builds+ctests every wired-in example in turn
# via build_all_examples.sh, rather than one runner per example. That
# used to mean a failure in one example couldn't take down another
# example's CI result (see this file's own git history for the
# constadv/constprop-vs-tinyddt incident that motivated per-example
# isolation originally) -- build_all_examples.sh keeps that property by
# continuing past a failed example instead of aborting the whole script,
# and reports a per-example PASS/BUILD_FAIL/TEST_FAIL summary table
# rather than relying on one job per example to make failures visible.
#
# Add new examples to build_all_examples.sh's own EXAMPLES table, not
# here -- there is no single source of truth the two are generated from,
# so an example's CMakeLists.txt changing its own target name(s) needs a
# matching edit there.
#
# compile-examples-cmake-nvhpc only runs on a manual trigger (the
# "Run workflow" button in the Actions tab, or `gh workflow run`) --
# installing the NVIDIA HPC SDK plus building+testing all ~20 examples
# takes much longer than the gnu/intel jobs, too slow to run on every PR.
# Run it by hand occasionally instead; nothing here needs editing to do
# that, `workflow_dispatch` is already wired up below.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compile-examples-cmake-gnu:
    name: cmake compile+run (gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gfortran, gcc, and g++
        # gcc/g++ are normally already present on ubuntu-latest via
        # build-essential, but tinyddt (C++/chost) and kessler (C + C++/
        # chost) both need them, so install explicitly rather than relying
        # on that -- matches the existing explicit gfortran install below
        # instead of leaving any of the three compilers implicit.
        run: sudo apt-get update && sudo apt-get install -y gfortran gcc g++

      - name: Install xdsl-ccpp
        run: python -m pip install -e .

      - name: Install CMake
        run: python -m pip install cmake

      - name: Build and test all examples
        env:
          COMPILER_LABEL: gnu
        run: bash .github/workflows/build_all_examples.sh

  compile-examples-cmake-intel:
    name: cmake compile+run (intel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Intel oneAPI compilers (ifx/icpx/icx)
        # Intel's apt repo ships the base compiler components free, no
        # license key needed. intel-oneapi-compiler-fortran gives ifx;
        # intel-oneapi-compiler-dpcpp-cpp gives icpx/icx (C++/C).
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-fortran intel-oneapi-compiler-dpcpp-cpp

      - name: Install xdsl-ccpp
        run: python -m pip install -e .

      - name: Install CMake
        run: python -m pip install cmake

      - name: Build and test all examples
        env:
          FC: ifx
          CC: icx
          CXX: icpx
          COMPILER_LABEL: intel
        run: |
          source /opt/intel/oneapi/setvars.sh
          bash .github/workflows/build_all_examples.sh

  compile-examples-cmake-nvhpc:
    name: cmake compile+run (nvhpc)
    # Manual-only (see this file's top-of-file comment) -- skipped on
    # pull_request/push, runs when triggered via the Actions tab's "Run
    # workflow" button or `gh workflow run compile-tests-cmake.yml`.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Free disk space (NVIDIA HPC SDK needs ~9.5 GB)
        # ubuntu-latest's documented ~14 GB free is too tight once the
        # HPC SDK's own footprint is added to the repo checkout, pip
        # installs, and this job's own build/ directory (20 examples'
        # worth of object files + executables). Removes several
        # preinstalled toolchains this job never uses (not a general
        # apt-get clean) to reclaim headroom -- a standard pattern for
        # CI jobs installing CUDA/HPC-SDK-sized toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/lib/jvm
          df -h /

      - name: Install NVIDIA HPC SDK (nvfortran/nvc/nvc++)
        # nvhpc-26-9 is the "slim" package (~9.5 GB installed), not the
        # larger nvhpc-26-9-cuda-multi bundle (~20 GB) -- this repo's
        # wired-in examples are all CPU-only, no GPU offload exercised.
        # The package name is version-pinned (NVIDIA ships no
        # unversioned "latest" meta-package the way Intel's oneAPI
        # components do) -- bump this name once NVIDIA drops 26.9 from
        # the apt index.
        run: |
          wget -qO- https://developer.download.nvidia.com/hpc-sdk/ubuntu/DEB-GPG-KEY-NVIDIA-HPC-SDK \
            | gpg --dearmor | sudo tee /usr/share/keyrings/nvidia-hpcsdk-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/nvidia-hpcsdk-archive-keyring.gpg] https://developer.download.nvidia.com/hpc-sdk/ubuntu/amd64 /" \
            | sudo tee /etc/apt/sources.list.d/nvhpc.list
          sudo apt-get update -y
          sudo apt-get install -y nvhpc-26-9

      - name: Add NVIDIA compilers to PATH
        run: |
          for d in /opt/nvidia/hpc_sdk/Linux_x86_64/*/compilers/bin; do
            echo "$d" >> "$GITHUB_PATH"
          done

      - name: Install xdsl-ccpp
        run: python -m pip install -e .

      - name: Install CMake
        run: python -m pip install cmake

      - name: Build and test all examples
        env:
          FC: nvfortran
          CC: nvc
          CXX: nvc++
          COMPILER_LABEL: nvhpc
        run: bash .github/workflows/build_all_examples.sh
